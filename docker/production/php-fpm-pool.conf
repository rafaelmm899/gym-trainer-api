[www]
user = app
group = app

listen = 127.0.0.1:9000

; Pass container environment variables through to PHP.
clear_env = no

; Cloud Run's smallest instances (256-512Mi) can't sustain the dev pool's 20
; children — keep this conservative. Cloud Run already scales instances
; horizontally under load; this pool only needs to survive one instance's
; concurrent requests.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Slightly above php.ini's max_execution_time (120s) so PHP's own timeout
; fires first with a clean 500, matching nginx's fastcgi_read_timeout.
request_terminate_timeout = 130s
