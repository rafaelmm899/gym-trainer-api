server {
    listen 8080;
    server_name _;

    charset utf-8;
    client_max_body_size 20M;

    # Default document root: the SPA's static build.
    root /var/www/spa;
    index index.html;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Everything Laravel owns — API, Sanctum's CSRF cookie route, the health
    # check, and (gated to local by its own Gate) the Scramble docs UI.
    # `^~` forces nginx to commit to this block (never fall through to the
    # SPA's `location /` below) for any of these prefixes; try_files'
    # internal rewrite to /index.php then gets matched again against the
    # `\.php$` location below, same as the original single-app nginx config.
    location ^~ /api/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /docs {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        # PHP's own max_execution_time (php.ini) is 120s for the in-request
        # AI calls (cycle planning, session analysis) — stay a bit above it
        # so PHP times out cleanly instead of nginx cutting the response
        # first.
        fastcgi_read_timeout 130s;
    }

    # The SPA: everything else. try_files falls back to index.html so
    # client-side routes (React Router) resolve on a hard refresh / deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
