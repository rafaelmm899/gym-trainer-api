name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/pint --test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - run: cp .env.example .env

      - uses: ramsey/composer-install@v3

      - run: php artisan key:generate

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - run: cp .env.example .env

      - uses: ramsey/composer-install@v3

      - run: php artisan key:generate

      - run: vendor/bin/pest --colors=always

      # Model PHPDoc blocks must be refreshed after any schema change. Runs
      # against SQLite to avoid a Postgres service; revisit if a Postgres-only
      # column type ever produces a false diff.
      - name: Model PHPDoc is up to date
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          touch database/database.sqlite
          php artisan migrate --force
          php artisan ide-helper:models --write --no-interaction
          vendor/bin/pint app/Models
          git diff --exit-status -- app/Models || {
            echo "::error::Model PHPDoc is stale — run 'composer ide-helper && vendor/bin/pint app/Models' and commit.";
            exit 1;
          }
